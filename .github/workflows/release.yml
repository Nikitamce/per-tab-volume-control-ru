name: Build & Release Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: meta
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build .zip and .xpi packages
        run: |
          mkdir -p dist
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP_NAME="per-tab-volume-control-${VERSION}.zip"
          XPI_NAME="per-tab-volume-control-${VERSION}.xpi"

          zip -r "dist/${ZIP_NAME}" \
            manifest.json \
            background.js \
            content_scripts \
            icons \
            locales \
            popup \
            shared \
            -x "**/.DS_Store"

          cp "dist/${ZIP_NAME}" "dist/${XPI_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Per-Tab Volume Control v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/per-tab-volume-control-${{ steps.meta.outputs.version }}.zip
            dist/per-tab-volume-control-${{ steps.meta.outputs.version }}.xpi
